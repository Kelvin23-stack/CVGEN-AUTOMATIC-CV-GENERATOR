<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — CVGEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/images/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link rel="shortcut icon" href="assets/images/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">

<div class="app-shell">
  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <a href="index.html" class="logo"><span class="logo-mark">CV</span>CVGEN</a>
    <nav class="side-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge fa"></i> Dashboard</a>
      <a href="cv-builder.html"><i class="fa-solid fa-plus fa"></i> Create CV</a>
      <a href="my-cvs.html"><i class="fa-solid fa-folder-open fa"></i> My CVs</a>
      <a href="templates.html"><i class="fa-solid fa-swatchbook fa"></i> Templates</a>
      <div class="nav-sep"></div>
      <a href="profile.html" class="active"><i class="fa-solid fa-user fa"></i> Profile</a>
      <a href="settings.html"><i class="fa-solid fa-gear fa"></i> Settings</a>
      <a href="#" class="logout-trigger"><i class="fa-solid fa-right-from-bracket fa"></i> Logout</a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar-sm" data-user-initial>U</div>
      <div>
        <strong data-user-name>User</strong>
        <span data-user-email>user@example.com</span>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="flex gap-10" style="align-items:center;">
        <button class="mobile-menu-btn icon-btn"><i class="fa-solid fa-bars"></i></button>
        <h2>Profile</h2>
      </div>
    </header>

    <div class="page-content">
      <div class="card" style="max-width:560px;">
        <div class="profile-header">
          <div class="avatar-lg" id="profileInitial">U</div>
          <div>
            <h3 style="font-size:1.2rem;" data-user-name>User Name</h3>
            <span class="tag-muted">Member since <span id="profileCreated">—</span></span>
          </div>
        </div>

        <form id="profileForm">
          <div class="field no-icon">
            <label for="profileName">Full Name</label>
            <input type="text" id="profileName">
          </div>
          <div class="field no-icon">
            <label for="profileEmail">Email Address</label>
            <input type="email" id="profileEmail" disabled style="opacity:.6;">
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
